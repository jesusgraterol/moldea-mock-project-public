version: 1
agents:
  field-notes:
    runtime:
      id: eve
    bindings:
      runtimeAgent:
        path: /agent/agent.ts
        symbol: default
      instructionLoader:
        path: /agent/instructions.md
    mirrors:
      - /agent/instructions.md
    affectedBy:
      - /package.json
    unresolved:
      provider-invocation:
        category: runtime-integration
        effect: blocking
        description: The root and knowledge subagent are source-only; no service, credentials, or provider-backed turn demonstrates engineer-facing delegation.
        resolution: In a separately authorized integration, configure an access-controlled entry point and credentials, then verify real FN-101, FN-102, and note-only alias turns load both instructions and return only attributed checked-in sources.
        related:
          - path: /agent/agent.ts
          - path: /agent/subagents/knowledge/agent.ts
  knowledge:
    runtime:
      id: eve
    bindings:
      runtimeAgent:
        path: /agent/subagents/knowledge/agent.ts
        symbol: default
      instructionLoader:
        path: /agent/subagents/knowledge/instructions.md
    tools:
      lookup-notes:
        name: lookup_notes
        description: Returns curated checked-in sources for FN-101, FN-102, or a known lag-note query.
        implementation:
          path: /agent/subagents/knowledge/source-catalog.ts
          symbol: lookupNotes
        registration:
          path: /agent/subagents/knowledge/tools/lookup_notes.ts
          symbol: default
        inputSchema:
          path: /agent/subagents/knowledge/contracts.ts
          symbol: LookupNotesInputSchema
    mirrors:
      - /agent/subagents/knowledge/instructions.md
    affectedBy:
      - /notes/ingest-lag.md
      - /notes/schema-rollout.md
      - /records/fn-101.md
      - /records/fn-102.md
      - /package.json
