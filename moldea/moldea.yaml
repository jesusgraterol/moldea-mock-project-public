version: 1
agents:
  alert-classifier:
    runtime:
      id: langgraph
      guidance: /moldea/runtimes/langgraph.md
    bindings:
      runtimeAgent:
        path: /src/alert-classifier.ts
        symbol: alertClassifierGraph
      inputSchema:
        path: /src/contracts.ts
        symbol: GraphInputSchema
      outputSchema:
        path: /src/contracts.ts
        symbol: GraphOutputSchema
      instructionLoader:
        path: /src/alert-classifier.ts
        symbol: loadAlertClassifierInstruction
    affectedBy:
      - /src/alert-classifier.ts
      - /src/contracts.ts
  handoff-brief:
    runtime:
      id: langgraph
      guidance: /moldea/runtimes/handoff-langgraph.md
    bindings:
      runtimeAgent:
        path: /src/handoff-brief.ts
        symbol: handoffBriefGraph
      inputSchema:
        path: /src/handoff-contracts.ts
        symbol: HandoffInputSchema
      outputSchema:
        path: /src/handoff-contracts.ts
        symbol: HandoffOutputSchema
      instructionLoader:
        path: /src/handoff-brief.ts
        symbol: loadHandoffBriefInstruction
    affectedBy:
      - /src/handoff-brief.ts
      - /src/handoff-contracts.ts
      - /src/contracts.ts
      - /src/alert-classifier.ts
